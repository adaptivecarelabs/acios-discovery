services:

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: acios
      POSTGRES_PASSWORD: acios
      POSTGRES_DB: acios_discovery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acios -d acios_discovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://acios:acios@postgres:5432/acios_discovery
      WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
