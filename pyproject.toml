[project]
name = "acios-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adaptivecarelabs", email = "adaptivecaremedicals@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "mypy>=2.3.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "alembic>=1.19.1",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.2.2",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "live: tests that access external live websites or services",
]
